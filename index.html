<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tea Leaf Studio</title>
  <meta name="description" content="Tea Leaf Studio makes small games by hand. Our first is Chicken's Life, a chicken training, racing and breeding game.">
  <link rel="icon" href="chickens-life/img/icon.png">
  <style>
    :root {
      --cream: #fff6df;
      --card: #fdf3dc;
      --ink: #3a2618;
      --ink-soft: #7a5a3c;
      --go: #5cb85c;
      --go-edge: #2f7a32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--cream);
      line-height: 1.6;
    }
    main { max-width: 720px; margin: 0 auto; padding: 56px 16px 64px; }
    h1 { font-size: clamp(2rem, 6vw, 2.8rem); margin: 0 0 4px; }
    .tagline { color: var(--ink-soft); font-weight: 600; margin: 0 0 40px; }
    h2 { font-size: 1.2rem; margin: 0 0 16px; }
    .game {
      display: flex; gap: 20px; align-items: center;
      background: var(--card); border: 4px solid var(--ink); border-radius: 20px;
      padding: 20px; box-shadow: 0 6px 0 var(--ink);
    }
    .game img { width: 96px; height: 96px; border-radius: 20px; image-rendering: pixelated; flex: none; }
    .game h3 { margin: 0 0 4px; font-size: 1.35rem; }
    .game p { margin: 0 0 12px; }
    .links { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
    .play {
      display: inline-block; padding: 10px 18px; border-radius: 12px;
      background: var(--go); color: #fff; font-weight: 800; text-decoration: none;
      box-shadow: 0 4px 0 var(--go-edge);
    }
    a { color: #1f4a99; }
    footer { margin-top: 48px; color: var(--ink-soft); font-size: 0.95rem; }
    @media (max-width: 480px) {
      .game { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tea Leaf Studio</h1>
    <p class="tagline">Small games, made by hand.</p>

    <h2>Games</h2>
    <div class="game">
      <img src="chickens-life/img/icon.png" alt="Chicken's Life icon">
      <div>
        <h3>Chicken's Life</h3>
        <p>Train it. Race it. Breed the perfect bird.</p>
        <div class="links">
          <a class="play" href="https://play.google.com/store/apps/details?id=com.chickenslife.game">Get it on Google Play</a>
          <a href="chickens-life/">About the game</a>
          <a href="chickens-life/privacy/">Privacy policy</a>
        </div>
      </div>
    </div>

    <footer>
      <h2>Contact</h2>
      <p><a href="mailto:nostagiagames21@gmail.com">nostagiagames21@gmail.com</a></p>
    </footer>
  </main>
</body>
</html>
